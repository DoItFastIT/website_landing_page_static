# Do It Fast IT — Cloudflare Pages Configuration
# Static site served by Cloudflare Pages
# API routes handled by Pages Functions in /functions/

name = "doitfastit"
compatibility_date = "2024-05-14"

[assets]
directory = "."
binding = "ASSETS"

[observability]
enabled = true

# ── Email Binding ──────────────────────────────────────────────
# 1. Go to: Cloudflare Dashboard → Workers & Pages → doitfastit → Settings → Bindings
# 2. Add Binding: Type = "Send Email", Variable name = SEB
# 3. Destination: support@doitfastit.com (must have Email Routing enabled)
# 4. Sender: contact-form@doitfastit.com (must be a verified address)
[[send_email]]
name = "SEB"
destination_address = "support@doitfastit.com"

# ── Environment Variables ──────────────────────────────────────
# ── IMPORTANT: Add TURNSTILE_SECRET via Cloudflare Dashboard only ─────────────
# Go to: Pages → doitfastit → Settings → Environment Variables → Add variable
# Variable name : TURNSTILE_SECRET
# Value         : 0x4AAAAAADPNUfUwrSvXuNtow_L3icVziXw   ← your secret key
# NEVER commit this value to GitHub

[vars]
ENVIRONMENT = "production"
TURNSTILE_SITE_KEY = "0x4AAAAAADPNUQkDQmBvGroU"
