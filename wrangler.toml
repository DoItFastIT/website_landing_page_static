# Do It Fast IT — Cloudflare Pages Configuration
# Static site served by Cloudflare Pages
# API routes handled by Pages Functions in /functions/

name = "doitfastit"
compatibility_date = "2024-05-14"

[assets]
directory = "."
binding = "ASSETS"

[observability]
enabled = true

# ── Environment Variables ──────────────────────────────────────
# ── IMPORTANT: Add Secrets via Cloudflare Dashboard only ───────────────────
# Go to: Pages → doitfastit → Settings → Environment Variables → Add variable
# 
# 1. BREVO_API_KEY  : [Your Brevo API Key]
# 2. TURNSTILE_SECRET : [Your Turnstile Secret Key]
# 
# NEVER commit these values to GitHub

[vars]
ENVIRONMENT = "production"
TURNSTILE_SITE_KEY = "0x4AAAAAADPNUQkDQmBvGroU"
